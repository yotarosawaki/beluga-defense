    story:'旅のおわり、南極海。吹雪のむこうで、この海をおさめる闇の帝王が待っている。',

const AMB = Array.from({ length:70 }, () => ({ x:Math.random(), y:Math.random(), s:0.4 + Math.random() * 0.9, p:Math.random() * 6 }));
const mod = (a, n) => ((a % n) + n) % n;

const player = { x:52, y:H/2, w:60, h:33, speed:260, hp:10 };
let stage, phase, phaseT, stageTime, cleared, clearInfo, bossWarn, bossRef, allies, squids, texts, squidTimer, bullets, enemies, particles, ammo, reloadEnd, lastShot, spawnTimer, elapsed, score, gameOver;
const keys = {}, mouse = { x:W/2, y:H/2, down:false };

function reset() {

// ---- ランキング ----
// FIREBASE_CONFIG を設定すると「みんなのランキング」（Firestore）に、未設定なら今までどおり端末内だけに保存する。
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyClphjTe780WJrcAf0zStK6dUaXun6N18Q",
  authDomain: "beluga-defense.firebaseapp.com",
  projectId: "beluga-defense",
};
const FIREBASE_ON = !!(FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('YOUR_') && window.firebase);
let db = null;
if (FIREBASE_ON) { try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); } catch (e) { db = null; } }

const RANK_KEY = 'beluga-defense-ranking', RANK_MAX = 10;
let ranking = [], lastRank = -1, entryActive = false, rankLoading = false, rankError = '';
function loadLocalRanking() { try { ranking = JSON.parse(localStorage.getItem(RANK_KEY)) || []; } catch (e) { ranking = []; } }
function saveLocalRanking(list) { try { localStorage.setItem(RANK_KEY, JSON.stringify(list)); } catch (e) {} }
loadLocalRanking();

async function refreshRanking() {
  if (!db) return;
  rankLoading = true; rankError = '';
  try {
    const snap = await db.collection('scores').orderBy('score', 'desc').limit(RANK_MAX).get();
    ranking = snap.docs.map(d => ({ name: d.data().name, score: d.data().score }));
  } catch (e) {
    rankError = 'よみこめなかったよ（端末内の記録を表示）'; loadLocalRanking();
  }
  rankLoading = false;
}
refreshRanking();

const entryEl = document.getElementById('entry'), nameEl = document.getElementById('name'), entryTitleEl = entryEl.querySelector('p');

function onGameOver() {
  lastRank = -1;
  if (score <= 0) return;
  if (!db) {   // 端末内ランキングのときは、上位に入ったときだけ登録をすすめる
    const qualifies = ranking.length < RANK_MAX || score > ranking[ranking.length - 1].score;
    if (!qualifies) return;
  }
  entryTitleEl.textContent = db ? 'みんなのランキングに登録しよう！' : 'ランキングに登録しよう！';
  entryActive = true; entryEl.style.display = 'block'; nameEl.value = ''; nameEl.focus();
}
function closeEntry() { entryActive = false; entryEl.style.display = 'none'; nameEl.blur(); }
function skipEntry() { closeEntry(); }
async function submitEntry() {
  if (!entryActive) return;
  const name = nameEl.value.trim().slice(0, 8) || 'ななし', entry = { name, score };
  closeEntry();
  // 端末内にも常に残す（通信できないときの保険）
  const local = JSON.parse(localStorage.getItem(RANK_KEY) || '[]');
  local.push(entry); local.sort((a, b) => b.score - a.score);
  saveLocalRanking(local.slice(0, RANK_MAX));
  if (db) {
    try {
      await db.collection('scores').add({ name, score, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    } catch (e) { rankError = '送信できなかったよ（端末内には保存したよ）'; }
    await refreshRanking();
  } else {
    ranking = local.slice(0, RANK_MAX);
  }
  lastRank = ranking.findIndex(r => r.name === name && r.score === score);
}
document.getElementById('ok').addEventListener('click', submitEntry);
document.getElementById('skip').addEventListener('click', skipEntry);
nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitEntry(); });

addEventListener('keydown', e => {
  if (e.target === nameEl) return;   // 名前入力中はゲーム操作を無視
  if ((e.key === ' ' || e.key === 'Enter') && (phase === 'intro' || phase === 'clear')) { skipCard(); e.preventDefault(); return; }
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key.toLowerCase() === 'r') { if (gameOver) { if (!entryActive) reset(); } else startReload(performance.now()); }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => { setMouse(e); mouse.down = true; if (gameOver && !entryActive) reset(); else skipCard(); });
addEventListener('mouseup', () => mouse.down = false);

// ---- スマホ操作：左側をなぞって上下移動／右側をおさえて撃つ／右下のボタンでリロード ----
let touchMode = matchMedia('(pointer: coarse)').matches;
const touch = { moveId:null, moveY:0, fireId:null };
const RELOAD_BTN = { x:W - 56, y:H - 56, r:34 };
function touchPos(t) {
  const r = cv.getBoundingClientRect();
  return { x:(t.clientX - r.left) * W / r.width, y:(t.clientY - r.top) * H / r.height };
}
cv.addEventListener('touchstart', e => {
  e.preventDefault(); touchMode = true;
  for (const t of e.changedTouches) {
    const p = touchPos(t);
    if (gameOver) { if (!entryActive) reset(); continue; }
    if (phase === 'intro' || phase === 'clear') { skipCard(); continue; }
    if (Math.hypot(p.x - RELOAD_BTN.x, p.y - RELOAD_BTN.y) < RELOAD_BTN.r + 6) { startReload(performance.now()); continue; }
    if (p.x < W * 0.30 && touch.moveId === null) { touch.moveId = t.identifier; touch.moveY = p.y; }
    else if (touch.fireId === null) { touch.fireId = t.identifier; mouse.x = p.x; mouse.y = p.y; mouse.down = true; }
  }
}, { passive:false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = touchPos(t);
    if (t.identifier === touch.moveId) touch.moveY = p.y;
    else if (t.identifier === touch.fireId) { mouse.x = p.x; mouse.y = p.y; }
  }
}, { passive:false });
function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.moveId) touch.moveId = null;
    if (t.identifier === touch.fireId) { touch.fireId = null; mouse.down = false; }
  }
}
cv.addEventListener('touchend', touchEnd, { passive:false });
cv.addEventListener('touchcancel', touchEnd, { passive:false });
document.addEventListener('gesturestart', e => e.preventDefault());

// 全画面（対応している端末では横向きに固定）
async function goFullscreen() {
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}
}
document.getElementById('fs').addEventListener('click', goFullscreen);
document.getElementById('fsbtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen(); else goFullscreen();
});
// ランキング入力欄を画面の大きさに合わせる
function fitEntry() { entryEl.style.setProperty('--s', Math.min(1.4, cv.getBoundingClientRect().width / 800).toFixed(2)); }
addEventListener('resize', fitEntry); addEventListener('orientationchange', fitEntry); fitEntry();

function startReload(now) {
  if (reloadEnd <= now && ammo < MAG) reloadEnd = now + RELOAD_TIME;
}

function shoot(now) {
  if (now < reloadEnd || now - lastShot < FIRE_INTERVAL) return;
  lastShot = now;
  const ox = player.x + 26, oy = player.y - 3;
  const a = Math.atan2(mouse.y - oy, mouse.x - ox) + (Math.random() - .5) * 0.04;
  bullets.push({ age:0, dmg:1, size:1, tint:null, x:ox, y:oy, vx:Math.cos(a) * BULLET_SPEED, vy:Math.sin(a) * BULLET_SPEED });
  if (--ammo <= 0) reloadEnd = now + RELOAD_TIME;
}

function startStage(i) {
  stage = i; phase = 'intro'; phaseT = 0; stageTime = 0; bossWarn = 0; bossRef = null;
  enemies = []; bullets = []; squids = []; spawnTimer = 1;
}
function advancePhase() {
  if (phase === 'intro') { phase = 'wave'; phaseT = 0; }
  else if (phase === 'clear') startStage(stage + 1);
}
function skipCard() {
  if (!gameOver && (phase === 'intro' || phase === 'clear') && phaseT > 0.4) { advancePhase(); return true; }
  return false;
}

// 出す敵の種類を、その海の割合から選ぶ（時間がたつほど大型が増える）
function pickKey(noBig, f) {
  const w = STAGES[stage].w, list = [];
  let tot = 0;
  for (const k in w) {
    if (noBig && k === 'big') continue;
    const v = w[k] * (k === 'big' ? 0.6 + 0.8 * f : 1);
    list.push([k, v]); tot += v;
  }
  let r = Math.random() * tot;
  for (const [k, v] of list) { if ((r -= v) < 0) return k; }
  return list[0][0];
}

function createEnemy(key, x, y, noWob) {
  const t = TYPES[key], st = STAGES[stage];
  const e = { type:key, ...t, speed:t.speed * st.speed, maxHp:t.hp, x, y, y0:y, flash:0, t:0, ph:Math.random() * 6 };
  if (key === 'normal' || key === 'jelly') { e.hp += Math.floor(stage / 3); e.maxHp = e.hp; }
  if (noWob) e.wob = null;
  else if (!e.wob && st.wobble && key !== 'big') e.wob = { amp:st.wobble, freq:2.2 };
  return e;
}
function randY(key, noWob) {
  const t = TYPES[key], st = STAGES[stage];
  const amp = noWob ? 0 : (t.wob ? t.wob.amp : (st.wobble && key !== 'big' ? st.wobble : 0));
  const lo = amp + t.h / 2 + 10, hi = H - amp - t.h / 2 - 10;
  return lo + Math.random() * (hi - lo);
}

function spawnWave(f) {
  const st = STAGES[stage];
  if (phase === 'wave' && Math.random() < st.pack) {
    // 3匹がV字の隊形でやってくる
    const key = pickKey(true, f), y0 = 100 + Math.random() * (H - 200);
    for (let i = -1; i <= 1; i++) enemies.push(createEnemy(key, W + 40 + Math.abs(i) * 30, y0 + i * 46, true));
    return;
  }
  const key = pickKey(false, f);
  enemies.push(createEnemy(key, W + TYPES[key].w, randY(key, false)));
}

// ---- ボス ----
function startBoss() {
  phase = 'boss';
  const B = STAGES[stage].boss, S = SPRITES[B.sprite], hp = 70 + 24 * stage;
  bossRef = { type:'boss', boss:true, sprite:B.sprite, name:B.name, crown:B.crown, chip:B.chip, w:S.w * 0.85, h:S.h * 0.85,
              hp, maxHp:hp, speed:0, dmg:5, score:300 + 150 * stage, flash:0, x:W + S.w / 2, y:H / 2, t:0, entering:true, summonCd:4 };
  enemies.push(bossRef);
  bossWarn = 2.6;
}
function summonMinions(e, enraged) {
  const n = 1 + (stage >= 3 ? 1 : 0) + (enraged ? 1 : 0);
  for (let i = 0; i < n; i++) {
    const key = pickKey(true, 1);
    const y = Math.max(30, Math.min(H - 30, e.y + (i - (n - 1) / 2) * 44));
    enemies.push(createEnemy(key, e.x - e.w / 2 - 10, y, true));
  }
  burst(e.x - e.w / 2, e.y, e.chip, 10, 150);
}
function updateBoss(e, dt) {
  e.t += dt;
  const S = SPRITES[e.sprite];
  if (e.entering) {
    e.x -= 130 * dt;
    if (e.x <= W - S.w / 2 - 30) e.entering = false;
  } else {
    const enraged = e.hp < e.maxHp * 0.5;
    e.x -= (8 + 2 * stage) * (enraged ? 1.6 : 1) * dt;   // ゆっくり防衛ラインへせまる
    e.summonCd -= dt;
    if (e.summonCd <= 0) {
      summonMinions(e, enraged);
      e.summonCd = Math.max(2.4, 6.5 - 0.5 * stage) * (enraged ? 0.7 : 1);
    }
  }
  const amp = Math.max(20, ((H - e.h) / 2 - 12) * 0.85);
  e.y = H / 2 + Math.sin(e.t * (0.7 + 0.08 * stage)) * amp;
}
function onBossDefeated(e) {
  for (const o of enemies) if (o !== e && o.hp > 0) { o.hp = 0; burst(o.x, o.y, o.chip, 10, 180); }
  burst(e.x, e.y, '#ffe066', 60, 340); burst(e.x, e.y, e.chip, 50, 260);
  floatText(e.x, e.y - e.h / 2 - 10, 'ボスげきは！', '#e8890c');
  bossRef = null; bullets = [];
  if (stage >= STAGES.length - 1) { cleared = true; gameOver = true; onGameOver(); return; }
  const heal = Math.min(2, 10 - player.hp);
  player.hp += heal;
  clearInfo = { bonus:e.score, heal };
  phase = 'clear'; phaseT = 0;
}

const ALLY_KINDS = {
  small: { sprite:'beluga_s', tx:118, dy:-52, w:40, h:22, rate:0.7, dmg:1, size:0.8, tint:'#ff8fb0' },
  large: { sprite:'beluga_l', tx:104, dy: 62, w:76, h:40, rate:1.1, dmg:2, size:1.6, tint:'#2f6fb8' },
};
function floatText(x, y, txt, color) { texts.push({ x, y, txt, color, life:1.1 }); }

function addAlly(kind) {
  const k = ALLY_KINDS[kind];
  allies.push({ kind, ...k, x:-70, y:player.y + k.dy, state:'idle', until:0, cd:0.5 });
  floatText(player.x + 50, player.y - 40, 'なかまが来た！', '#e8890c');
}

function collectSquid(q) {
  q.got = true;
  const missing = ['small', 'large'].filter(k => !allies.some(a => a.kind === k));
  if (missing.length) addAlly(missing[0]);
  burst(q.x, q.by, '#ffe066', 22, 200);
}

function updateAllies(dt, now) {
  // イカの出現：仲間が足りないときだけ、一定間隔で右から流れてくる
  if (allies.length < 2 && !squids.length) squidTimer -= dt;
  if (squidTimer <= 0) {
    squids.push({ x:W + 40, y:70 + Math.random() * (H - 140), t:Math.random() * 6 });
    squidTimer = 8 + Math.random() * 4;
  }
  for (const q of squids) {
    q.x -= 65 * dt; q.t += dt;
    q.by = q.y + Math.sin(q.t * 2.2) * 9;
    // 触れても取れない。バブルを3回当てると仲間になる（当てるたびに色が変わる）
    const sw = SPRITES.squid.w, sh = SPRITES.squid.h;
    q.flash = Math.max(0, (q.flash || 0) - dt);
    for (const b of bullets) {
      if (q.got || b.dead) continue;
      if (Math.abs(b.x - q.x) < sw / 2 + 22 && Math.abs(b.y - q.by) < sh / 2 + 24) {
        b.dead = true; q.hits = (q.hits || 0) + 1; q.flash = 0.15;
        burst(q.x, q.by, SQUID_LOOK[Math.min(q.hits, SQUID_HITS - 1)].chip, 12, 170);
        if (q.hits >= SQUID_HITS) collectSquid(q);
      }
    }
  }
  squids = squids.filter(q => !q.got && q.x > -60);

  for (const a of allies) {
    if (a.state === 'idle') {
      const ty = Math.max(a.h / 2, Math.min(H - a.h / 2, player.y + a.dy));
      a.x += (a.tx - a.x) * Math.min(1, 5 * dt);
      a.y += (ty - a.y) * Math.min(1, 6 * dt);
      // 敵にぶつかられたら痛がる → 逃げる
      for (const e of enemies) {
        if (e.hp <= 0 || (e.hitAllies && e.hitAllies.has(a))) continue;
        if (Math.abs(e.x - a.x) < e.w / 2 + a.w / 2 - 4 && Math.abs(e.y - a.y) < e.h / 2 + a.h / 2 - 2) {
          (e.hitAllies = e.hitAllies || new Set()).add(a);
          a.state = 'hurt'; a.until = now + 550; a.vx = 0;
          burst(a.x, a.y, '#ff6b6b', 10, 160); floatText(a.x, a.y - a.h / 2 - 8, 'きゃっ！', '#e33');
          break;
        }
      }
      // 自動で一番近い敵を撃つ（弾数は消費しない）
      a.cd -= dt;
      if (a.state === 'idle' && a.cd <= 0) {
        let tgt = null;
        for (const e of enemies) if (e.hp > 0 && e.x > a.x + 20 && e.x < W && (!tgt || e.x < tgt.x)) tgt = e;
        if (tgt) {
          a.cd = a.rate;
          const ox = a.x + a.w * 0.4, oy = a.y - 2, ang = Math.atan2(tgt.y - oy, tgt.x - ox);
          bullets.push({ age:0, dmg:a.dmg, size:a.size, tint:a.tint, x:ox, y:oy, vx:Math.cos(ang) * 560, vy:Math.sin(ang) * 560 });
        }
      }
    } else if (a.state === 'hurt') {
      if (now >= a.until) a.state = 'flee';
    } else if (a.state === 'flee') {
      a.vx = (a.vx || 0) - 900 * dt;              // 後ろ（左）へ猛ダッシュ
      a.x += a.vx * dt; a.y -= 30 * dt;
      if (Math.random() < 0.6) particles.push({ x:a.x + a.w / 2, y:a.y + (Math.random() - .5) * a.h, vx:60, vy:-20, life:0.5, size:2.5, color:'#fff', rot:0 });
      if (a.x < -120) a.dead = true;
    }
  }
  allies = allies.filter(a => !a.dead);

  for (const t of texts) { t.y -= 24 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
}

function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random());
    particles.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:0.5 + Math.random() * 0.5,
                     size:1.5 + Math.random() * 3, color, rot:Math.random() * 6 });
  }
}

function update(dt, now) {
  if (gameOver) return;
  if (phase === 'intro' || phase === 'clear') {   // ステージのカード表示中は止める
    phaseT += dt;
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.vx *= 0.98; p.life -= dt; p.rot += dt * 8; }
    particles = particles.filter(p => p.life > 0);
    for (const t of texts) { t.y -= 24 * dt; t.life -= dt; }
    texts = texts.filter(t => t.life > 0);
    if (phaseT > (phase === 'intro' ? 6 : 5)) advancePhase();
    return;
  }
  elapsed += dt;
  if (bossWarn > 0) bossWarn -= dt;

  if (keys['w'] || keys['arrowup']) player.y -= player.speed * dt;
  if (keys['s'] || keys['arrowdown']) player.y += player.speed * dt;
  if (touch.moveId !== null) {                       // 指の高さへ、すいーっと移動
    const dy = touch.moveY - player.y;
    player.y += Math.sign(dy) * Math.min(Math.abs(dy), 460 * dt);
  }
  player.y = Math.max(player.h/2, Math.min(H - player.h/2, player.y));

  if (reloadEnd && now >= reloadEnd) { ammo = MAG; reloadEnd = 0; }
  if (mouse.down) shoot(now);

  const st = STAGES[stage];
  if (phase === 'wave') {
    stageTime += dt;
    if (stageTime >= WAVE_DUR) startBoss();
  }
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    const f = phase === 'wave' ? stageTime / WAVE_DUR : 1;
    const idle = allies.filter(a => a.state === 'idle').length;
    spawnWave(f);
    // 進むほど・仲間が多いほど、敵がふえる。ボス戦中は少なめ
    spawnTimer = Math.max(0.55, st.interval * (1 - 0.25 * f)) * (0.7 + Math.random() * 0.6) * (1 - 0.18 * idle) * (phase === 'boss' ? 2.6 : 1);
  }

  updateAllies(dt, now);

  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.age += dt; }
  for (const e of enemies) {
    if (e.boss) updateBoss(e, dt);
    else {
      e.x -= e.speed * dt; e.t += dt;
      if (e.wob) e.y = e.y0 + Math.sin(e.t * e.wob.freq + e.ph) * e.wob.amp;
    }
    e.flash = Math.max(0, e.flash - dt);
  }

  // 弾 vs 敵
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      if (Math.abs(b.x - e.x) < e.w/2 + 3 && Math.abs(b.y - e.y) < e.h/2 + 3) {
        b.dead = true;
        e.hp -= b.dmg; e.flash = 0.08;
        e.x += e.boss ? 0.6 : e.type === 'big' ? 6 : 14;   // ノックバック
        burst(b.x, b.y, '#fff', 3, 120);
        if (e.hp <= 0) { score += e.score; burst(e.x, e.y, e.chip, e.type === 'big' ? 40 : 16, 220); if (e.boss) onBossDefeated(e); }
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead && b.x > -10 && b.x < W + 10 && b.y > -10 && b.y < H + 10);

  // 防衛ライン到達
  for (const e of enemies) {
    if (e.hp > 0 && e.x - e.w/2 <= LINE_X) {
      player.hp -= e.dmg; player.hurtUntil = now + 700;
      if (e.boss) e.x += 260; else e.hp = 0;   // ボスは押し戻される
      burst(LINE_X + 4, e.y, '#ff6b6b', 12, 160);
      if (player.hp <= 0) { player.hp = 0; gameOver = true; onGameOver(); }
    }
  }
  enemies = enemies.filter(e => e.hp > 0);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.vx *= 0.98; p.life -= dt; p.rot += dt * 8;
  }
  particles = particles.filter(p => p.life > 0);
}

// ベルーガを描く。mode: 'idle' | 'hurt'(震えて赤くなる) | 'flee'(逃げる)、t: 痛がり残り(1→0)
function drawBeluga(S, cx, cy, mode, t, now, flip) {
  const u = S.scale;
  let bx = Math.round(cx - S.w / 2), by = Math.round(cy - S.h / 2), img = S.img;
  if (mode === 'hurt') {
    bx += Math.round(Math.sin(now / 20) * 4 * t) - Math.round(6 * t);
    by -= Math.round(Math.sin((1 - t) * Math.PI) * 4);
    if (Math.floor(now / 70) % 2) img = S.hurtImg;
  } else if (mode === 'flee') {
    bx += Math.round(Math.sin(now / 25) * 2); by += Math.round(Math.sin(now / 40) * 2);
    img = S.hurtImg;
  }
  ctx.save();
  if (flip) { ctx.translate(bx + S.w / 2, 0); ctx.scale(-1, 1); ctx.translate(-(bx + S.w / 2), 0); }
  ctx.drawImage(img, bx, by);
  if (mode !== 'idle') {
    // 目を「> <」風にぎゅっと閉じて、なみだ
    ctx.fillStyle = '#fff'; ctx.fillRect(bx + 12 * u, by + 4 * u, 3 * u, 3 * u);
    ctx.fillStyle = '#1f2a38';
    ctx.fillRect(bx + 13 * u, by + 4 * u, u, u); ctx.fillRect(bx + 14 * u, by + 5 * u, u, u); ctx.fillRect(bx + 13 * u, by + 6 * u, u, u);
    ctx.fillStyle = '#5aa9d6';
    ctx.fillRect(bx + 15 * u, by + 7 * u, u, u); ctx.fillRect(bx + 15 * u, by + 9 * u - Math.round(t * u), u, u);
  }
  ctx.restore();
}

function wrapText(txt, cx, y, maxW, lh) {
  let line = '', yy = y;
  for (const ch of txt) {
    if (ctx.measureText(line + ch).width > maxW) { ctx.fillText(line, cx, yy); line = ch; yy += lh; }
    else line += ch;
  }
  ctx.fillText(line, cx, yy);
}

function drawBackground(now, st) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, st.bg[0]); g.addColorStop(1, st.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  for (let y = 40; y < H; y += 60)
    for (let x = ((y * 7) % 40) - (now / 60 % 40); x < W; x += 40) ctx.fillRect(x, y, 14, 3);
  const d = st.deco;
  if (d === 'ice') {                       // 氷とふぶき
    for (let i = 0; i < 7; i++) {
      const x = mod(i * 140 - now * 0.006 * (1 + i % 3), W + 140) - 70, w = 80 + (i % 3) * 20, h = 8 + (i % 2) * 6;
      ctx.fillStyle = '#fff'; ctx.fillRect(x, 0, w, h);
      ctx.fillStyle = '#cfe9f6'; ctx.fillRect(x + 6, h, w - 12, 5);
    }
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const a of AMB) ctx.fillRect(mod(a.x * W - now * 0.02 * a.s, W), mod(a.y * H + now * 0.04 * a.s, H), 2, 2);
  } else if (d === 'rough') {              // あらい波
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
    for (let k = 0; k < 6; k++) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const y = 40 + k * 72 + Math.sin((x + now * 0.08 * (k % 2 ? 1 : -1)) / 34 + k) * 9;
        if (x) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  } else if (d === 'warm') {               // 光の筋とあわ
    ctx.fillStyle = 'rgba(255,255,255,.13)';
    for (let i = 0; i < 5; i++) {
      const bx = 80 + i * 170 + Math.sin(now / 1800 + i) * 30;
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 50, 0); ctx.lineTo(bx - 90, H); ctx.lineTo(bx - 170, H); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1;
    for (const a of AMB.slice(0, 25)) {
      ctx.beginPath(); ctx.arc(mod(a.x * W, W) + Math.sin(now / 600 + a.p) * 4, mod(a.y * H - now * 0.03 * a.s, H), 2 + a.s * 2, 0, 7); ctx.stroke();
    }
  } else if (d === 'coral') {              // サンゴ礁
    ctx.fillStyle = '#f3dfa0'; ctx.fillRect(0, H - 12, W, 12);
    const cols = ['#ff8fab', '#ffb86b', '#c77dff', '#ff6b8b'];
    for (let i = 0; i < 22; i++) {
      const x = i * 38 + (i * 13 % 17), h = 22 + ((i * 37) % 46), by = H - 12 - h;
      ctx.fillStyle = cols[i % 4];
      ctx.fillRect(x, by, 10, h); ctx.fillRect(x - 8, by + h * 0.3, 8, 6); ctx.fillRect(x + 10, by + h * 0.5, 8, 6);
      ctx.fillRect(x - 8, by + h * 0.3 - 10, 6, 10); ctx.fillRect(x + 12, by + h * 0.5 - 10, 6, 10);
    }
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const a of AMB.slice(0, 20)) if (Math.sin(now / 300 + a.p) > 0.6) ctx.fillRect(a.x * W, a.y * (H - 60), 3, 3);
  } else if (d === 'deep') {               // 深海のプランクトン
    for (const a of AMB) {
      ctx.fillStyle = 'rgba(140,255,230,' + (0.25 + 0.5 * Math.abs(Math.sin(now / 700 + a.p))).toFixed(2) + ')';
      ctx.fillRect(mod(a.x * W - now * 0.01 * a.s, W), mod(a.y * H + Math.sin(now / 1500 + a.p) * 20, H), 3, 3);
    }
  } else if (d === 'blizzard') {           // 氷山
    ctx.fillStyle = '#eef6fc';
    for (let i = 0; i < 4; i++) {
      const x = i * 230 + 40;
      ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + 40, H - 60 - (i % 2) * 30); ctx.lineTo(x + 70, H - 30);
      ctx.lineTo(x + 110, H - 80 - (i % 3) * 10); ctx.lineTo(x + 150, H); ctx.closePath(); ctx.fill();
    }
  }
}

function drawOverlay(now, st) {
  if (st.deco === 'fog') {
    ctx.fillStyle = 'rgba(236,243,248,.22)';
    for (let i = 0; i < 6; i++) {
      ctx.beginPath(); ctx.ellipse(mod(i * 260 + now * 0.015 * (1 + i % 2), W + 520) - 260, 50 + i * 70, 200, 46, 0, 0, 7); ctx.fill();
    }
  } else if (st.deco === 'deep') {
    const g = ctx.createRadialGradient(player.x + 70, player.y, 110, player.x + 70, player.y, 470);
    g.addColorStop(0, 'rgba(0,10,30,0)'); g.addColorStop(1, 'rgba(0,10,30,.55)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else if (st.deco === 'blizzard') {
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5;
    for (const a of AMB) {
      const x = mod(a.x * W - now * 0.45 * a.s, W), y = mod(a.y * H + now * 0.05 * a.s, H);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 14, y - 3); ctx.stroke();
    }
  }
}

function drawCrown(e, S) {
  const c = e.crown, q = Math.max(3, Math.round(S.scale * 0.7));
  const cx = e.x - S.w / 2 + S.w * c.x, cy = e.y - S.h / 2 + S.h * c.y;
  const x0 = Math.round(cx - 3.5 * q), y0 = Math.round(cy - 3 * q);
  ctx.fillStyle = '#ffd23f';
  [0, 3, 6].forEach(k => ctx.fillRect(x0 + k * q, y0, q, q));
  ctx.fillRect(x0, y0 + q, 7 * q, q); ctx.fillRect(x0, y0 + 2 * q, 7 * q, q);
  ctx.fillStyle = '#e03a3a'; ctx.fillRect(x0 + 3 * q, y0 + 2 * q, q, q);
}

function drawTouchUI(now, st) {
  ctx.save();
  ctx.fillStyle = st.ui; ctx.textAlign = 'center';
  ctx.globalAlpha = touch.moveId !== null ? 0.16 : 0.07;          // 左：移動ゾーン
  ctx.fillRect(LINE_X, 60, W * 0.30 - LINE_X, H - 120);
  ctx.globalAlpha = 0.35; ctx.font = 'bold 22px sans-serif';
  ctx.fillText('▲', W * 0.15, H * 0.38); ctx.fillText('▼', W * 0.15, H * 0.66);
  if (touch.moveId !== null) { ctx.globalAlpha = 0.5; ctx.fillRect(W * 0.15 - 22, touch.moveY - 2, 44, 4); }
  const b = RELOAD_BTN, reloading = reloadEnd > now;             // 右下：リロード
  ctx.globalAlpha = 0.85; ctx.fillStyle = reloading ? '#e8890c' : 'rgba(30,60,90,.75)';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.fillText(reloading ? '…' : 'リロード', b.x, b.y + 5);
  ctx.restore();
}

function drawCards(now, st) {
  ctx.textAlign = 'center';
  if (phase === 'intro') {
    ctx.globalAlpha = Math.min(1, phaseT * 3);
    ctx.fillStyle = 'rgba(8,24,44,.82)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#9fd8ff'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('STAGE ' + (stage + 1) + ' / ' + STAGES.length, W / 2, 110);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 54px sans-serif'; ctx.fillText(st.name, W / 2, 178);
    ctx.fillStyle = '#e8f4ff'; ctx.font = '18px sans-serif'; wrapText(st.story, W / 2, 240, 540, 30);
    ctx.fillStyle = '#ffe066'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('この海のボス：' + st.boss.name, W / 2, 350);
    if (Math.floor(now / 500) % 2) { ctx.fillStyle = '#fff'; ctx.font = '15px sans-serif'; ctx.fillText(touchMode ? 'タップでスタート' : 'クリックでスタート', W / 2, 400); }
    ctx.globalAlpha = 1;
  } else if (phase === 'clear' && clearInfo) {
    ctx.fillStyle = 'rgba(8,24,44,.75)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffe066'; ctx.font = 'bold 46px sans-serif'; ctx.fillText('STAGE CLEAR!', W / 2, 130);
    ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.fillText(st.boss.name + ' をたおした！', W / 2, 178);
    ctx.font = '18px sans-serif'; ctx.fillText('ボーナス +' + clearInfo.bonus, W / 2, 222);
    if (clearInfo.heal) ctx.fillText('HP かいふく +' + clearInfo.heal, W / 2, 252);
    ctx.fillStyle = '#9fd8ff'; ctx.font = 'bold 22px sans-serif'; ctx.fillText('つぎの海：' + STAGES[stage + 1].name, W / 2, 310);
    if (Math.floor(now / 500) % 2) { ctx.fillStyle = '#fff'; ctx.font = '15px sans-serif'; ctx.fillText(touchMode ? 'タップですすむ' : 'クリックですすむ', W / 2, 400); }
  }
  if (bossWarn > 0 && phase === 'boss') {
    if (Math.floor(bossWarn * 6) % 2) {
      ctx.font = 'bold 52px sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#d92b2b';
      ctx.strokeText('WARNING!', W / 2, 200); ctx.fillText('WARNING!', W / 2, 200);
    }
    ctx.font = 'bold 22px sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#123';
    ctx.strokeText('ボス「' + st.boss.name + '」が近づいてくる…', W / 2, 245); ctx.fillText('ボス「' + st.boss.name + '」が近づいてくる…', W / 2, 245);
  }
}

function draw(now) {
  const st = STAGES[stage];
  ctx.clearRect(0, 0, W, H);
  drawBackground(now, st);

  // 防衛ライン
  ctx.fillStyle = 'rgba(230,50,50,.35)'; ctx.fillRect(0, 0, LINE_X, H);
  ctx.strokeStyle = '#e33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(LINE_X, 0); ctx.lineTo(LINE_X, H); ctx.stroke();

  // 敵
  ctx.imageSmoothingEnabled = false;
  if (st.glow) { ctx.shadowColor = 'rgba(255,255,255,.85)'; ctx.shadowBlur = 8; }   // 暗い海でも敵が見えるように
  for (const e of enemies) {
    const S = SPRITES[e.sprite];
    ctx.drawImage(e.flash > 0 ? S.flashImg : S.img, Math.round(e.x - S.w / 2), Math.round(e.y - S.h / 2));
    if (e.crown) drawCrown(e, S);
    if (!e.boss && e.hp < e.maxHp) {
      const by = e.y - S.h / 2 - 6;
      ctx.fillStyle = '#789'; ctx.fillRect(e.x - 15, by, 30, 3);
      ctx.fillStyle = '#3c6'; ctx.fillRect(e.x - 15, by, 30 * e.hp / e.maxHp, 3);
    }
  }
  ctx.shadowBlur = 0;

  // 弾（あわ）
  for (const b of bullets) {
    // バブルリング：進むほど少し広がる
    const r = (4 + Math.min(3, b.age * 6)) * b.size, col = b.tint || 'rgba(90,169,214,.9)';
    ctx.fillStyle = 'rgba(200,240,255,.22)';
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(b.x, b.y, r - 1.2, 0, 7); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(b.x, b.y, r - 2.5, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
  }

  // パーティクル
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
    ctx.restore();
  }

  // イカ（光るアイテム）
  for (const q of squids) {
    const look = SQUID_LOOK[Math.min(q.hits || 0, SQUID_HITS - 1)], S = SPRITES[look.sprite];
    const pulse = 0.5 + 0.5 * Math.sin(q.t * 5), gr = 38 + pulse * 10 + (q.flash ? 14 : 0);
    const g = ctx.createRadialGradient(q.x, q.by, 4, q.x, q.by, gr);
    g.addColorStop(0, 'rgba(' + look.glow + ',.85)'); g.addColorStop(1, 'rgba(' + look.glow + ',0)');
    ctx.fillStyle = g; ctx.fillRect(q.x - gr, q.by - gr, gr * 2, gr * 2);
    ctx.drawImage(q.flash > 0 ? S.flashImg : S.img, Math.round(q.x - S.w / 2), Math.round(q.by - S.h / 2));
    // 残りあと何回か（●が当てた回数）
    for (let i = 0; i < SQUID_HITS; i++) {
      ctx.fillStyle = i < (q.hits || 0) ? '#ff5fa8' : 'rgba(255,255,255,.8)'; ctx.strokeStyle = '#c90'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(q.x + (i - 1) * 10, q.by - S.h / 2 - 8, 3.5, 0, 7); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    const sx = Math.sin(q.t * 4) * 26, sy = Math.cos(q.t * 3) * 20;
    ctx.fillRect(Math.round(q.x + sx), Math.round(q.by + sy), 3, 3);
    ctx.fillRect(Math.round(q.x - sy), Math.round(q.by + sx * .7), 2, 2);
  }

  // 仲間ベルーガ
  for (const a of allies) {
    const S = SPRITES[a.sprite];
    if (a.state === 'idle') drawBeluga(S, a.x, a.y + Math.round(Math.sin(now / 250 + a.dy) * 2), 'idle', 0, now, false);
    else if (a.state === 'hurt') drawBeluga(S, a.x, a.y, 'hurt', (a.until - now) / 550, now, false);
    else drawBeluga(S, a.x, a.y, 'flee', 0.5, now, true);
  }

  // プレイヤー（ベルーガ）
  const B = SPRITES.beluga, hurt = player.hurtUntil > now;
  if (hurt) {
    const t = (player.hurtUntil - now) / 700;
    drawBeluga(B, player.x, player.y, 'hurt', t, now, false);
    const bx = Math.round(player.x - B.w / 2), by = Math.round(player.y - B.h / 2) - Math.round(Math.sin((1 - t) * Math.PI) * 4);
    ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'left';
    const ty = by - 8 - (1 - t) * 14;
    ctx.globalAlpha = Math.min(1, t * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText('いたっ！', bx + 20, ty);
    ctx.fillStyle = '#e33'; ctx.fillText('いたっ！', bx + 20, ty);
    ctx.globalAlpha = 1;
  } else {
    drawBeluga(B, player.x, player.y + Math.round(Math.sin(now / 250) * 2), 'idle', 0, now, false);
  }

  drawOverlay(now, st);

  // ふわっと浮かぶ文字
  ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(t.txt, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  // 照準
  ctx.strokeStyle = st.ui; ctx.globalAlpha = 0.7; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 7, 0, 7);
  ctx.moveTo(mouse.x - 11, mouse.y); ctx.lineTo(mouse.x + 11, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 11); ctx.lineTo(mouse.x, mouse.y + 11); ctx.stroke(); ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = st.ui; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('HP', 30, 24);
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i < player.hp ? '#e33' : '#9bb'; ctx.fillRect(58 + i * 14, 11, 11, 14);
  }
  ctx.fillStyle = st.ui; ctx.fillText('SCORE ' + score, 30, 46);

  ctx.textAlign = 'right';
  if (reloadEnd > now) {
    const p = 1 - (reloadEnd - now) / RELOAD_TIME;
    ctx.fillStyle = '#b55a00'; ctx.fillText('潜って息つぎ中…', W - 20, 24);
    ctx.fillStyle = '#9bb'; ctx.fillRect(W - 170, 32, 150, 8);
    ctx.fillStyle = '#e80'; ctx.fillRect(W - 170, 32, 150 * p, 8);
  } else {
    ctx.fillStyle = ammo <= 5 ? '#ff4d4d' : st.ui;
    ctx.fillText('AMMO ' + ammo + ' / ' + MAG, W - 20, 24);
    ctx.fillStyle = '#9bb'; ctx.fillRect(W - 170, 32, 150, 8);
    ctx.fillStyle = '#39c'; ctx.fillRect(W - 170, 32, 150 * ammo / MAG, 8);
  }
  // ステージ表示・進みぐあい／ボスのHP
  ctx.textAlign = 'center'; ctx.fillStyle = st.ui; ctx.font = 'bold 15px sans-serif';
  ctx.fillText('STAGE ' + (stage + 1) + '/' + STAGES.length + '　' + st.name, W / 2, 22);
  if (phase === 'boss' && bossRef && bossRef.hp > 0) {
    const bw = 260, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(bx, 30, bw, 10);
    ctx.fillStyle = '#e33'; ctx.fillRect(bx, 30, bw * bossRef.hp / bossRef.maxHp, 10);
    ctx.fillStyle = st.ui; ctx.font = 'bold 13px sans-serif'; ctx.fillText(bossRef.name, W / 2, 56);
  } else if (phase === 'wave') {
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(W / 2 - 100, 30, 200, 6);
    ctx.fillStyle = '#39c'; ctx.fillRect(W / 2 - 100, 30, 200 * Math.min(1, stageTime / WAVE_DUR), 6);
  }
  ctx.globalAlpha = 0.55; ctx.fillStyle = st.ui; ctx.font = '12px sans-serif';
  ctx.fillText(touchMode ? 'ひだりをなぞって移動 ／ みぎをおさえて連射' : 'W/S・↑↓ 移動 ／ マウス長押し 連射 ／ R リロード', W / 2, H - 8);
  ctx.globalAlpha = 1;

  if (touchMode && !gameOver && phase !== 'intro' && phase !== 'clear') drawTouchUI(now, st);
  drawCards(now, st);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 40px sans-serif'; ctx.fillText(cleared ? 'ALL CLEAR!' : 'GAME OVER', W / 2, 70);
    ctx.font = '20px sans-serif'; ctx.fillText('SCORE ' + score, W / 2, 102);
    ctx.font = '15px sans-serif'; ctx.fillStyle = '#cfe8ff';
    ctx.fillText(cleared ? '七つの海をわたったベルーガたち。海に平和がもどったよ！' : 'STAGE ' + (stage + 1) + '　' + st.name + ' で力つきた…', W / 2, 128);
    ctx.fillStyle = '#fff';
    if (!entryActive) {
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText(db ? '🌏 みんなのランキング' : '🏆 ランキング（この端末）', W / 2, 148);
      ctx.font = '15px sans-serif';
      if (rankLoading) ctx.fillText('読み込み中…', W / 2, 172);
      else if (rankError) { ctx.fillStyle = '#ffcf8f'; ctx.fillText(rankError, W / 2, 172); ctx.fillStyle = '#fff'; }
      else if (!ranking.length) ctx.fillText('まだ記録がありません', W / 2, 172);
      ctx.font = '16px sans-serif';
      ranking.slice(0, 10).forEach((r, i) => {
        const y = 182 + i * 21, me = i === lastRank;
        if (me) { ctx.fillStyle = 'rgba(255,224,102,.25)'; ctx.fillRect(W / 2 - 170, y - 15, 340, 20); }
        ctx.fillStyle = me ? '#ffe066' : '#fff';
        ctx.textAlign = 'left';  ctx.fillText((i + 1) + '位', W / 2 - 155, y);
        ctx.fillText(r.name, W / 2 - 90, y);
        ctx.textAlign = 'right'; ctx.fillText(r.score, W / 2 + 155, y);
      });
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText(touchMode ? 'タップでリトライ' : 'クリックまたは R でリトライ', W / 2, 424);
    }
  }
}

const portraitMQ = matchMedia('(orientation: portrait) and (pointer: coarse)');
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!portraitMQ.matches) update(dt, now);   // たて向きのあいだは一時停止
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
